<div class="row">
    <div class="col-12 col-md-8">
      <h2>Login</h2>
      <!-- Login Form -->
      <form (ngSubmit)="onLoginSubmit()">
        <!-- Error Alert -->
        <div *ngIf="formError" class="alert alert-danger" role="alert">
          {{ formError }}
        </div>
  
        <!-- Name Field -->
        <div class="form-group">
          <label for="name">Name</label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            class="form-control" 
            placeholder="Enter Name" 
            [(ngModel)]="credentials.name">
        </div>
  
        <!-- Email Field -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="Enter email address" 
            [(ngModel)]="credentials.email">
        </div>
  
        <!-- Password Field -->
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="e.g., 12+ alphanumerics" 
            [(ngModel)]="credentials.password">
        </div>
  
        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary">
          Sign In!
        </button>
      </form>
    </div>
  </div>
